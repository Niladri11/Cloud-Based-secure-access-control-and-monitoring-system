<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — SecureAccess</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1> SecureAccess</h1>
      <p class="subtitle">Create a new account</p>

      <div class="alert alert-error"   id="errorMsg"></div>
      <div class="alert alert-success" id="successMsg"></div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Choose a username" autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password <span style="color:var(--muted);font-weight:400">(min 8 chars)</span></label>
        <input type="password" id="password" placeholder="Create a strong password" autocomplete="new-password" />
      </div>

      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" placeholder="Repeat password" autocomplete="new-password" />
      </div>

      <button class="btn btn-primary" id="regBtn" onclick="handleRegister()">Create Account</button>

      <p style="text-align:center;margin-top:1.25rem;font-size:.88rem;color:var(--muted)">
        Already have an account? <a href="index.html">Sign in</a>
      </p>
    </div>
  </div>

  <script>
    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg; el.classList.add('show');
      document.getElementById('successMsg').classList.remove('show');
    }
    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg; el.classList.add('show');
      document.getElementById('errorMsg').classList.remove('show');
    }

    async function handleRegister() {
      const username = document.getElementById('username').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      const btn = document.getElementById('regBtn');

      if (!username || !email || !password) { showError('All fields are required.'); return; }
      if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }
      if (password !== confirm) { showError('Passwords do not match.'); return; }

      btn.disabled = true; btn.textContent = 'Creating account…';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password }),
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error || 'Registration failed.'); return; }

        showSuccess('Account created! Redirecting to login…');
        setTimeout(() => window.location.href = 'index.html', 1500);
      } catch (e) {
        showError('Network error. Please try again.');
      } finally {
        btn.disabled = false; btn.textContent = 'Create Account';
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleRegister(); });
  </script>
</body>
</html>
